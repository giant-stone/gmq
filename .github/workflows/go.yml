name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GMQ_RDS: "redis://localhost:6379/14?dial_timeout=1s&read_timeout=1s&max_retries=1"

    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        go-version: ["1.20", "1.26"]
        redis-version: [5, 6]
        exclude:
          # The native Windows Redis package provides Redis 5 only.
          - os: windows-latest
            redis-version: 6

    steps:
      - uses: actions/checkout@v7

      - name: Start Redis on Linux
        if: runner.os == 'Linux'
        uses: supercharge/redis-github-action@1.4.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Start Redis on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/start-redis.ps1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v ./...

      - name: Typecheck
        run: go vet ./...

      - name: Test
        run: go test -timeout=5m -v ./...
